<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-radius: 12px; }
        .notif-ALERTA { border-left: 4px solid #dc2626; }
        .notif-SUCESSO { border-left: 4px solid #16a34a; }
        .notif-INFO { border-left: 4px solid #2563eb; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark" style="background: linear-gradient(135deg, #1e3a5f, #2563eb);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/app">💰 Infnet Financeiro</a>
    </div>
</nav>

<div class="container py-4">
    <a th:href="@{/app/usuarios/{id}(id=${usuario.id})}" class="btn btn-link ps-0 mb-3">← Voltar ao usuário</a>

    <div class="card">
        <div class="card-body">
            <h4>🔔 Notificações de <span th:text="${usuario.nome}">Usuário</span></h4>
            <p class="text-muted small">
                Componente front-end consumindo o microsserviço via OpenFeign + Eureka.
            </p>

            <div th:if="${#lists.isEmpty(notificacoes)}" class="alert alert-info">
                Nenhuma notificação encontrada para este usuário.
            </div>

            <div th:each="n : ${notificacoes}" class="card mb-3" th:classappend="' notif-' + ${n.tipo}">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1" th:text="${n.titulo}">Título</h6>
                            <p class="mb-1" th:text="${n.mensagem}">Mensagem</p>
                            <small class="text-muted" th:text="${n.dataCriacao}">Data</small>
                        </div>
                        <div class="text-end">
                            <span class="badge"
                                  th:classappend="${n.tipo == 'ALERTA'} ? 'bg-danger' : (${n.tipo == 'SUCESSO'} ? 'bg-success' : 'bg-primary')"
                                  th:text="${n.tipo}">TIPO</span>
                            <br>
                            <span class="badge mt-1"
                                  th:classappend="${n.lida} ? 'bg-secondary' : 'bg-warning text-dark'"
                                  th:text="${n.lida} ? 'Lida' : 'Não lida'">Status</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
