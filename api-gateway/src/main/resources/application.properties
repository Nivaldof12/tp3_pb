server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=infnet-core
spring.cloud.gateway.routes[0].uri=lb://infnet-core
spring.cloud.gateway.routes[0].predicates[0]=Path=/usuarios/**,/financeiros/**,/historico/**,/app/**

spring.cloud.gateway.routes[1].id=notificacao-service
spring.cloud.gateway.routes[1].uri=lb://notificacao-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/notificacoes/**
