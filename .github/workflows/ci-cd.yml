name: CI/CD Infnet

on:
  push:
    branches: [main, TP4, TP5]
  pull_request:
    branches: [main, TP4, TP5]

jobs:
  test:
    name: Testes unitarios (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Executar testes
        run: chmod +x mvnw && ./mvnw -B test

  docker-build:
    name: Build imagens Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build microsservicos
        run: |
          for module in eureka-server infnet-core notificacao-service api-gateway; do
            docker build -f docker/Dockerfile --build-arg MAVEN_MODULE=$module -t infnet/$module:${{ github.sha }} .
          done

  smoke-docker:
    name: Smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Subir stack (servicos essenciais)
        run: |
          docker compose -f docker/compose/docker-compose.prod.yml up -d --build \
            mysql rabbitmq zipkin eureka-server infnet-core notificacao-service api-gateway
      - name: Aguardar microsservicos
        run: |
          set -e
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8761/actuator/health >/dev/null \
              && curl -sf http://localhost:8081/actuator/health >/dev/null \
              && curl -sf http://localhost:8080/app >/dev/null; then
              echo "Stack pronta apos ${i} tentativas"
              exit 0
            fi
            echo "Aguardando stack... ($i/90)"
            sleep 10
          done
          docker compose -f docker/compose/docker-compose.prod.yml ps
          docker compose -f docker/compose/docker-compose.prod.yml logs --no-color eureka-server infnet-core api-gateway | tail -n 200
          exit 1
      - name: Smoke IT
        run: chmod +x mvnw && ./mvnw -B -pl system-tests verify -Dgroups=integration
        env:
          SMOKE_BASE_URL: http://localhost:8080
      - name: Encerrar stack
        if: always()
        run: docker compose -f docker/compose/docker-compose.prod.yml down -v

  kubernetes-manifests:
    name: Validar manifests Kubernetes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Dry-run apply (sem cluster K8s)
        run: kubectl apply --dry-run=client --validate=false -f k8s/
