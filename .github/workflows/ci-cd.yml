name: CI/CD Infnet

on:
  push:
    branches: [main, TP4, TP5]
  pull_request:
    branches: [main, TP4, TP5]

jobs:
  test:
    name: Testes unitarios (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Executar testes
        run: chmod +x mvnw && ./mvnw -B test

  docker-build:
    name: Build imagens Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build microsservicos
        run: |
          for module in eureka-server infnet-core notificacao-service api-gateway; do
            docker build -f docker/Dockerfile --build-arg MAVEN_MODULE=$module -t infnet/$module:${{ github.sha }} .
          done

  smoke-docker:
    name: Smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Subir stack de producao
        run: |
          docker compose -f docker/compose/docker-compose.prod.yml up -d --build
      - name: Aguardar Gateway
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Smoke IT
        run: ./mvnw -B -pl system-tests verify -Dgroups=integration
        env:
          SMOKE_BASE_URL: http://localhost:8080
      - name: Encerrar stack
        if: always()
        run: docker compose -f docker/compose/docker-compose.prod.yml down -v

  kubernetes-manifests:
    name: Validar manifests Kubernetes
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Dry-run apply
        run: kubectl apply --dry-run=client -f k8s/
