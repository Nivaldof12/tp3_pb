global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: eureka-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["eureka-server:8761"]

  - job_name: infnet-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["infnet-core:8081"]

  - job_name: notificacao-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notificacao-service:8082"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
