apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: infnet-core-hpa
  namespace: infnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infnet-core
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notificacao-service-hpa
  namespace: infnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notificacao-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
